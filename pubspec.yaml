name: kulit_lumpia
description: "Aplikasi Android Pengelolaan Penjualan dan Distribusi Kulit Lumpia"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend & Autentikasi Supabase
  supabase_flutter: ^2.8.3

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigasi & Routing Terstruktur
  go_router: ^14.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

